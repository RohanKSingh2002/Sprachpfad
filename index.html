<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sprachpfad: German A1–B1 practice</title>
    <meta
      name="description"
      content="Personal German practice from A1 to B1: grammar lessons, drills with instant corrections, swipeable flashcards, a practice calendar and a mock test for each level."
    />
    <meta name="theme-color" content="#16233F" />
    <meta property="og:title" content="Sprachpfad: German A1–B1 practice" />
    <meta property="og:description" content="Grammar lessons, drills, flashcards and mock tests for German A1, A2 and B1." />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23F2C02A' stroke='%2316233F' stroke-width='5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply a saved light/dark choice before the page is drawn, so it doesn't flash (see js/ui/theme.js).
      try {
        const theme = localStorage.getItem("sprachpfad-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/lesson.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/test.css" />
  </head>
  <body>
    <a class="skip" href="#app">Skip to content</a>
    <header class="nav">
      <div class="wrap">
        <a class="logo" href="#/" aria-label="Sprachpfad home"><i aria-hidden="true"></i><span>Sprachpfad</span></a>
        <nav class="topnav" aria-label="Main">
          <a href="#/" data-nav="home">Lessons</a>
          <a href="#/karten" data-nav="karten">Flashcards</a>
          <a href="#/test" data-nav="test">Mock test</a>
        </nav>
        <button class="theme-switch" id="themeSwitch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="ts-track" aria-hidden="true">
            <span class="ts-knob"></span>
            <svg class="ts-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="ts-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <main id="app" class="wrap" tabindex="-1">
      <section class="boot" id="boot">
        <p class="muted">Loading the lessons…</p>
        <noscript><p>Sprachpfad needs JavaScript to run.</p></noscript>
      </section>
    </main>

    <footer class="foot">
      <div class="wrap">
        <span>Sprachpfad. Your progress is saved in this browser only.</span>
        <button class="link-btn" id="reset" type="button">Reset progress</button>
      </div>
    </footer>

    <nav class="dock" aria-label="Main, mobile">
      <a href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 3v18" />
          <circle cx="6" cy="7.5" r="2.3" fill="currentColor" />
          <circle cx="6" cy="16.5" r="2.3" fill="var(--surface)" />
          <path d="M11.5 7.5h8M11.5 16.5h8" />
        </svg>
        Lessons
      </a>
      <a href="#/karten" data-nav="karten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="7.5" width="13" height="13" rx="2" />
          <path d="M7.5 4h10.5a2 2 0 0 1 2 2v10.5" />
        </svg>
        Cards
      </a>
      <a href="#/test" data-nav="test">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4.5" y="4.5" width="15" height="16.5" rx="2" />
          <path d="M9 3h6v3H9z" />
          <path d="m8.8 13.2 2.3 2.3 4.4-4.6" />
        </svg>
        Test
      </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      // Browsers block JavaScript modules on pages opened straight from disk, so explain how to open the site.
      if (location.protocol === "file:") {
        document.getElementById("boot").innerHTML =
          "<h1>Open Sprachpfad through a local server</h1>" +
          '<p class="muted">Browsers don\'t load the site\'s modules and lesson files from a page opened straight from disk. ' +
          "In VS Code, right-click index.html and choose <b>Open with Live Server</b>, or run " +
          "<code>python -m http.server</code> in this folder and go to <code>http://localhost:8000</code>.</p>";
      }
    </script>
    <!-- Motion libraries. The site works without them (offline); animations are then skipped. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Flip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
